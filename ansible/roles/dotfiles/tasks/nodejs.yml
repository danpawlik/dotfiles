---
- name: Check if NodeJS is already available
  environment:
    PATH: ~/.local/bin:/usr/local/bin/:{{ ansible_env.PATH }}
  ansible.builtin.command: npm --version
  changed_when: false
  register: npm_version
  failed_when: false

- name: Setup NodeJS
  when: npm_version.rc != 0 or nodejs_userspace
  block:
    - name: Remove old nodejs dirs
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "~/.local/yarn"
        - "~/.local/nodejs"

    - name: Remove old nodejs symlinks
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "~/.local/bin/npm"
        - "~/.local/bin/node"
        - "~/.local/bin/yarn"

    - name: Ensure local dir exists
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - "~/.local/bin"
        - "~/.local/yarn"
        - "~/.local/nodejs"

    - name: Check if xz command is available
      ansible.builtin.command: which xz
      changed_when: false
      register: _xz_installed
      failed_when: false

    - name: Install xz package
      when: not _xz_installed.stdout
      become: true
      ansible.builtin.package:
        name: xz
        state: present

    - name: Get latest version
      when: nodejs_version == "latest"
      block:
        - name: Fetch publication page
          ansible.builtin.get_url:
            url: https://nodejs.org/dist/latest/
            dest: /tmp/nodejs-latest
            mode: '0644'

        - name: Get version
          ansible.builtin.shell: |
            sed -r 's/^.*href="([^"]+)".*/\1/' /tmp/nodejs-latest | grep linux-x64.tar.gz | cut -f2 -d'-'
          changed_when: false
          register: latest_nodejs_version

    - name: Download and unpack nodejs
      vars:
        nodejs_download_version: "{{ latest_nodejs_version.stdout | default(nodejs_version, true) }}"
      ansible.builtin.unarchive:
        src: "https://nodejs.org/dist/{{ nodejs_download_version }}/node-{{ nodejs_download_version }}-linux-x64.tar.xz"
        dest: ~/.local/nodejs
        remote_src: true
        extra_opts: [--strip-components=1]

    - name: Download and unpack yarn
      ansible.builtin.unarchive:
        src: "https://yarnpkg.com/latest.tar.gz"
        dest: ~/.local/yarn
        remote_src: true
        extra_opts: [--strip-components=1]

    - name: Create symlinks
      ansible.builtin.file:
        src: "{{ item.src }}"
        dest: "{{ item.dest }}"
        state: link
      loop:
        - src: "~/.local/nodejs/bin/npm"
          dest: "~/.local/bin/npm"
        - src: "~/.local/nodejs/bin/node"
          dest: "~/.local/bin/node"
        - src: "~/.local/yarn/bin/yarn"
          dest: "~/.local/bin/yarn"

- name: Install nodejs package
  become: true
  when: npm_version.rc != 0 and not nodejs_userspace
  ansible.builtin.package:
    name: nodejs
    state: present
