---
- name: Ensure local bin dir exists
  ansible.builtin.file:
    path: ~/.local/bin
    state: directory

- name: Install vivid (LS_COLORS generator for ls)
  ansible.builtin.unarchive:
    src: "https://github.com/sharkdp/vivid/releases/download/{{ vivid_version }}/vivid-{{ vivid_version }}-x86_64-unknown-linux-musl.tar.gz"
    dest: ~/.local/bin
    remote_src: true
    extra_opts:
      - --strip-components=1
    creates: ~/.local/bin/vivid

- name: Install fzf (used for history search and fuzzy Tab completion)
  become: true
  ansible.builtin.package:
    name: fzf
    state: present

- name: Install ble.sh
  block:
    - name: Check if ble.sh already exists
      ansible.builtin.stat:
        path: ~/.local/share/blesh/ble.sh
      register: _blesh_status

    - name: Clone ble.sh
      when: not _blesh_status.stat.exists
      ansible.builtin.git:
        repo: https://github.com/akinomyoga/ble.sh
        dest: /tmp/ble.sh
        depth: 1
        recursive: true

    - name: Build and install ble.sh
      when: not _blesh_status.stat.exists
      ansible.builtin.shell: |
        make install PREFIX=~/.local
      args:
        chdir: /tmp/ble.sh
      changed_when: true

- name: Copy bash config files
  ansible.builtin.copy:
    src: "/tmp/dotfiles/bash/{{ item }}"
    dest: "~/{{ item }}"
    remote_src: true
  loop:
    - .bashrc
    - .bash_aliases

- name: Change user shell to bash
  become: true
  ansible.builtin.user:
    name: "{{ ansible_user_id }}"
    shell: /bin/bash
