---
- name: Clone doom emacs
  ansible.builtin.git:
    repo: https://github.com/doomemacs/core
    dest: ~/.config/emacs
    depth: 1

- name: Install emacs
  become: true
  ansible.builtin.package:
    name: emacs
    state: present

- name: Install doom emacs
  ansible.builtin.command: ~/.config/emacs/bin/doom install
  args:
    chdir: ~/.config/emacs
    creates: ~/.config/doom/init.el
